name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SDK_CHECKOUT_TOKEN }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Needs only the checkout, so a broken link fails before the install.
      - name: Check documentation links
        run: yarn docs:lint

      - name: Install dependencies
        run: yarn install

      - name: Audit dependencies for high/critical CVEs
        run: yarn audit:ci

      - name: Run tests
        run: yarn test:all
